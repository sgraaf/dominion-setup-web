[project]
name = "dominion-setup-web"
version = "0.0.0"
description = "Set up a game of Dominion in your browser, with dominion-setup running in Pyodide."
authors = [{name = "Steven van de Graaf", email = "steven@vandegraaf.xyz"}]
license = "GPL-3.0-only"
requires-python = ">=3.11, <4"
# The app runs the wheel of the version in uv.lock (see scripts/sync_wheel.py).
dependencies = [
    "dominion-setup>=2026.5.0",
]

[dependency-groups]
dev = [
    "pillow",
    "playwright",
    "prek",
    "pytest",
    "ty",
]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # missing-trailing-comma (flake8-commas)
    "CPY001",  # missing-copyright-notice (flake8-copyright)
    "E501",  # line-too-long (pycodestyle), handled by the formatter
    "INP001",  # implicit-namespace-package (flake8-no-pep420), as there are no packages
]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/test_*.py" = [
    "D",  # pydocstyle
    "PLR2004",  # magic-value-comparison (Pylint)
    "S101",  # assert (flake8-bandit)
]
"scripts/*.py" = [
    "T201",  # print (flake8-print)
]

[tool.ty.src]
include = ["py", "scripts", "tests/py"]

[tool.ty.environment]
extra-paths = ["py", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["py", "scripts"]
testpaths = ["tests/py"]
